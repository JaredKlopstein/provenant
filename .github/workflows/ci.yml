name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Runs first and separately: if the open-core boundary is broken, nothing
      # else about the build matters.
      - name: Open-core boundary
        run: pnpm run lint:boundaries

      - run: pnpm run typecheck
      - run: pnpm run test

