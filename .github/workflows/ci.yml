name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose -- package.json's `packageManager` field
      # pins pnpm, and specifying both makes the action fail with
      # ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Runs first and separately: if the open-core boundary is broken, nothing
      # else about the build matters.
      - name: Open-core boundary
        run: pnpm run lint:boundaries

      - run: pnpm run typecheck
      - run: pnpm run test

      # The verifier must work with no network and no code from core or cloud.
      # That independence is the product's credibility, so it is proven, not asserted.
      - name: Verifier is offline and independent
        run: pnpm run test:offline

